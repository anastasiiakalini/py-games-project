<div class="sidebar-nav">

  {% if user.is_authenticated %}

    <div class="d-flex align-items-center gap-3">

      <a class="nav-link p-0"
       href="{{ user.get_absolute_url }}">
        {{ user.username }}
      </a>

      <form method="post"
            action="{% url 'logout' %}"
            class="m-0">

        {% csrf_token %}

        <button type="submit"
                class="nav-link btn btn-link p-0">
            Logout
        </button>
      </form>
    </div>

    {% else %}

        <a class="nav-link p-0"
           href="{% url 'login' %}">
            Login
        </a>

    {% endif %}

</div>
