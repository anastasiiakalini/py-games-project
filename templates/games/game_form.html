{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}

  <h1 class="display-5 fw-bolder text-black mb-2 my-5 text-center position-relative">
    {{ object|yesno:"Update,Create" }} game
  </h1>

  <form action=""
        method="post"
        novalidate
        class="container py-4 mx-auto"
        style="max-width: 700px;">

    {% csrf_token %}
    {{ form|crispy }}

    <input type="submit"
           value="Submit"
           class="btn btn-success">
  </form>

{% endblock %}
