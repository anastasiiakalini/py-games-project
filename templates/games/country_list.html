{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}

  <h1>Countries</h1>

  <form method="get" action="" class="form-inline">
    {{ search_form|crispy }}
    <input class="btn btn-secondary" type="submit" value="Search">
  </form>

  <br>
  {% if country_list %}
    <ul>
    {% for country in country_list %}
      <li>
        <a href="{% url 'games:developer-by-country' country.slug %}">
          {{ country.name }}
        </a>
      </li>
    {% endfor %}
    </ul>
  {% else %}
    <p>There are no countries!</p>
  {% endif %}

{% endblock %}
